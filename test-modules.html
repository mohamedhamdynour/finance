<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار الوحدات — Phase 1B/2</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui; padding: 20px; background: #f4f6fb; }
    h1 { color: #1a56db; }
    pre { background: #0f1729; color: #f0f4ff; padding: 12px; border-radius: 8px; overflow-x: auto; }
    .test { padding: 8px 0; border-bottom: 1px solid #e8edf5; font-size: 13px; }
    .ok::before  { content: '✓ '; color: #0d9488; font-weight: 900; }
    .err::before { content: '✗ '; color: #e11d48; font-weight: 900; }
    h2 { color: #1a56db; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>اختبار الوحدات — Phase 1B/2</h1>
  <p style="color:#666">هذه الصفحة لا تحاول الاتصال بـ Supabase فعليًا — فقط تتحقق أن الوحدات تُحمَّل وتُصدّر ما هو متوقع.</p>
  <div id="results"></div>
  <h2>ملخص</h2>
  <pre id="summary">جاري التشغيل...</pre>

  <script type="module">
    import { conn, APP_SETTINGS } from './js/state.js';
    import { initFromStorage, authHeaders, api, sbGet, sbPost, sbPatch, sbDel, sbUpsert, sbRpc, sbPatchBy, connect, disconnect, sbPostResilient } from './js/core/supabase.js';
    import { setAuthSuccessHandler, showAuthError, setAuthTab, showAuthLoading, connectSupabase, disconnectSupabase, doSignup, doLogin, doLogout, onAuthed, initAuthGate, isAuthenticated, getCurrentUser } from './js/core/auth.js';
    import { CURRENCY_LABELS, normalizeCurrencies, loadAppSettings, persistAppSettings, populateCurrencySelect, populateAllCurrencySelects, updateCurrencyLabels, addSettingsCurrency, renameSettingsCurrency, removeSettingsCurrency, setSettingsChangeHandler, saveGeneralSettings, saveGoldApiKey, METAL_TYPES_BY_CURRENCY, getMetalTypeList, populateMetalTypeSelect, onMetalTypeChange, renderSettings, renderSchemaAlert } from './js/core/settings.js';

    const results = [];
    let passed = 0, failed = 0;

    function test(name, fn) {
      try {
        const r = fn();
        if (r === true) { passed++; results.push({ ok: true, name }); }
        else { failed++; results.push({ ok: false, name, detail: r }); }
      } catch (e) {
        failed++; results.push({ ok: false, name, detail: e.message });
      }
    }

    // ═══════════════ supabase.js ═══════════════
    test('initFromStorage موجود', () => typeof initFromStorage === 'function' ? true : 'غير موجود');
    test('authHeaders() يرجع كائناً', () => typeof authHeaders() === 'object' ? true : 'غير كائن');
    test('authHeaders() يحتوي Content-Type', () => authHeaders()['Content-Type'] === 'application/json' ? true : JSON.stringify(authHeaders()['Content-Type']));
    test('authHeaders() يستخدم SB_KEY في apikey', () => authHeaders().apikey === conn.SB_KEY ? true : 'apikey مختلف');
    test('api دالة', () => typeof api === 'function' ? true : 'ليس دالة');
    test('sbGet/sbPost/sbPatch/sbDel/sbUpsert/sbRpc/sbPatchBy/sbPostResilient كلها دوال',
      () => [sbGet, sbPost, sbPatch, sbDel, sbUpsert, sbRpc, sbPatchBy, sbPostResilient].every(f => typeof f === 'function') ? true : 'بعضها ليس دالة');
    test('connect/disconnect دالتان', () => typeof connect === 'function' && typeof disconnect === 'function' ? true : 'غير موجودة');

    // ═══════════════ auth.js ═══════════════
    test('setAuthSuccessHandler موجود', () => typeof setAuthSuccessHandler === 'function' ? true : 'غير موجود');
    test('doLogin/doSignup/doLogout دوال',
      () => [doLogin, doSignup, doLogout].every(f => typeof f === 'function') ? true : 'بعضها ليس دالة');
    test('initAuthGate دالة', () => typeof initAuthGate === 'function' ? true : 'غير موجود');
    test('isAuthenticated() = false (لا جلسة)', () => isAuthenticated() === false ? true : `القيمة: ${isAuthenticated()}`);
    test('getCurrentUser() = null (لا جلسة)', () => getCurrentUser() === null ? true : `القيمة: ${getCurrentUser()}`);

    // ═══════════════ settings.js ═══════════════
    test('CURRENCY_LABELS.USD = "دولار أمريكي"',
      () => CURRENCY_LABELS.USD === 'دولار أمريكي' ? true : `القيمة: ${CURRENCY_LABELS.USD}`);
    test('METAL_TYPES_BY_CURRENCY.EGP مصفوفة', () =>
      Array.isArray(METAL_TYPES_BY_CURRENCY.EGP) ? true : 'غير مصفوفة');
    test('getMetalTypeList() = 6 عناصر لـ EGP',
      () => getMetalTypeList().length === 6 ? true : `العدد: ${getMetalTypeList().length}`);
    test('normalizeCurrencies() لا يكسر قائمة الكائنات', () => {
      normalizeCurrencies();
      return APP_SETTINGS.currencies.every(c => c.code && c.name) ? true : JSON.stringify(APP_SETTINGS.currencies);
    });
    test('normalizeCurrencies() يحوّل السلاسل إلى كائنات', () => {
      const backup = APP_SETTINGS.currencies;
      APP_SETTINGS.currencies = ['EGP', 'USD'];
      normalizeCurrencies();
      const ok = APP_SETTINGS.currencies[0].code === 'EGP'
              && APP_SETTINGS.currencies[1].code === 'USD'
              && APP_SETTINGS.currencies[0].name.length > 0;
      APP_SETTINGS.currencies = backup;
      return ok ? true : JSON.stringify(APP_SETTINGS.currencies);
    });
    test('loadAppSettings/persistAppSettings دوال',
      () => typeof loadAppSettings === 'function' && typeof persistAppSettings === 'function' ? true : 'غير موجودة');
    test('populateCurrencySelect دالة', () => typeof populateCurrencySelect === 'function' ? true : 'غير موجود');
    test('setSettingsChangeHandler موجود', () => typeof setSettingsChangeHandler === 'function' ? true : 'غير موجود');
    test('renderSettings/renderSchemaAlert دوال',
      () => typeof renderSettings === 'function' && typeof renderSchemaAlert === 'function' ? true : 'بعضها ليس دالة');

    // ═══════════════ DOM Safety ═══════════════
    test('showAuthError(id غير موجود) لا يرمي خطأ', () => {
      showAuthError('nonexistent-element-id', 'test');
      return true;
    });
    test('populateCurrencySelect(id غير موجود) لا يرمي خطأ', () => {
      populateCurrencySelect('nonexistent');
      return true;
    });
    test('renderSettings() بلا DOM لا يرمي خطأ', () => {
      renderSettings();
      return true;
    });
    test('onMetalTypeChange() بلا DOM لا يرمي خطأ', () => {
      onMetalTypeChange();
      return true;
    });

    // ═══════════════ منطق الحفظ (dry-run) ═══════════════
    test('persistAppSettings لا يرمي عند عدم وجود جلسة', async () => {
      // لا نستنى — فقط نتأكد أن الاستدعاء لا يسبب خطأ متزامن
      try { await persistAppSettings(); return true; } catch (e) { return e.message; }
    });

    // ═══════════════ عرض النتائج ═══════════════
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = results.map(r =>
      `<div class="test ${r.ok ? 'ok' : 'err'}">${r.name}${r.ok ? '' : ' — ' + (r.detail || 'فشل')}</div>`
    ).join('');

    const total = passed + failed;
    document.getElementById('summary').textContent =
      `✅ نجح: ${passed}   ❌ فشل: ${failed}   📊 الإجمالي: ${total}`;
    console.log(`[Tests-2] ${passed}/${total} passed`);
    if (failed > 0) console.warn('[Tests-2] Failed:', results.filter(r => !r.ok));
  </script>
</body>
</html>
